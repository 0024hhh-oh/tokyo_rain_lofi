name: Thumbnail tests

on:
  pull_request:
    paths:
      - scripts/generate_drive_thumbnails.py
      - tests/test_generate_drive_thumbnails.py
      - .github/workflows/generate_thumbnails.yml
      - .github/workflows/thumbnail_tests.yml
      - assets/thumbnail/**
  push:
    branches:
      - main
    paths:
      - scripts/generate_drive_thumbnails.py
      - tests/test_generate_drive_thumbnails.py
      - .github/workflows/generate_thumbnails.yml
      - .github/workflows/thumbnail_tests.yml
      - assets/thumbnail/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_generate_drive_thumbnails.py -v
