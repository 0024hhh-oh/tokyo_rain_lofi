name: Problem scene lighting CI

on:
  pull_request:
    paths:
      - "src/NightVideoLightingLoop.tsx"
      - "scripts/prepare_remotion_background.mjs"
      - "scripts/validate_problem_scene_lighting.mjs"
      - "test_assets/problem-scene.jpg.b64"
      - "tests/**"
      - ".github/workflows/problem_scene_lighting_ci.yml"

permissions:
  contents: read

jobs:
  render-problem-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare the reported tunnel scene
        run: |
          mkdir -p public video_assets dist
          base64 --decode test_assets/problem-scene.jpg.b64 > video_assets/background.jpg
          ffmpeg -y -loop 1 -i video_assets/background.jpg \
            -t 4 -r 30 -c:v libx264 -pix_fmt yuv420p public/night-source.mp4
          node scripts/prepare_remotion_background.mjs video_assets
          printf '{\n  "sourceDurationInFrames": 120\n}\n' > src/generated-video-metadata.json
      - name: Render the exact production component for eight seconds
        run: |
          npx remotion render \
            src/index.ts \
            NightVideoLightingLoop \
            dist/problem-scene-lighting-sample.mp4 \
            --codec=h264 \
            --crf=14 \
            --concurrency=2 \
            --muted \
            --frames=0-239 \
            --log=verbose
      - name: Verify the pillar stays stable and the signal changes
        run: |
          ffmpeg -v error -ss 0.30 -i dist/problem-scene-lighting-sample.mp4 \
            -frames:v 1 dist/problem-steady.png
          ffmpeg -v error -ss 3.05 -i dist/problem-scene-lighting-sample.mp4 \
            -frames:v 1 dist/problem-boost.png
          node scripts/validate_problem_scene_lighting.mjs \
            dist/problem-steady.png dist/problem-boost.png
          read -r width height duration < <(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height:format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              dist/problem-scene-lighting-sample.mp4 | xargs
          )
          python - "$width" "$height" "$duration" <<'PY'
          import sys
          width, height = map(int, sys.argv[1:3])
          duration = float(sys.argv[3])
          if (width, height) != (1920, 1080):
              raise SystemExit(f"Expected 1920x1080; got {width}x{height}")
          if not 7.9 <= duration <= 8.1:
              raise SystemExit(f"Expected 8 seconds; got {duration:.3f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: problem-scene-lighting-sample
          path: |
            dist/problem-scene-lighting-sample.mp4
            dist/problem-steady.png
            dist/problem-boost.png
          if-no-files-found: error
          retention-days: 7
