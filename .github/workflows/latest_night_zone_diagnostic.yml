name: Latest night zone diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/latest_night_zone_diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: pip install -r requirements.txt
      - name: Download four latest completed source videos read-only
        run: |
          mkdir -p diagnostic
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          files = {
              "Batch_20": "1_2pMZUVpQKr_1Jh7Zrgx1mXq4Qt0Fzn-",
              "Batch_21": "1HnGc1zBz9xzn-W0Nm-8e7yxu7P7Ut0fn",
              "Batch_24": "1pVCt1kCHEcmr4wIzG5yg2H-67MD9btZf",
              "Batch_25": "1_Dar4ug-2SzsOEIvrXlSoqAMpfio9B3s",
          }
          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          service = build("drive", "v3", credentials=credentials, cache_discovery=False)
          for name, file_id in files.items():
              request = service.files().get_media(fileId=file_id, supportsAllDrives=True)
              destination = Path("diagnostic") / f"{name}.mov"
              with destination.open("wb") as handle:
                  downloader = MediaIoBaseDownload(handle, request)
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
              print(name, destination.stat().st_size)
          PY
      - name: Extract source frames and analyze selected zones
        run: |
          for name in Batch_20 Batch_21 Batch_24 Batch_25; do
            mkdir -p "diagnostic/$name-assets"
            ffmpeg -loglevel error -y -i "diagnostic/$name.mov" \
              -frames:v 1 -update 1 "diagnostic/$name-assets/background.png"
            node scripts/prepare_remotion_background.mjs "diagnostic/$name-assets"
            cp src/generated-light-zones.json "diagnostic/$name-zones.json"
            cp public/background.png "diagnostic/$name-frame.png"
            NAME="$name" node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const name = process.env.NAME;
          const lighting = JSON.parse(fs.readFileSync(`diagnostic/${name}-zones.json`, 'utf8'));
          const safe = lighting.zones.filter((z) => z.hasLightCore && z.warmth >= 0.4 && z.y < 0.72).slice(0, 3);
          const boxes = safe.map((z, index) => {
            const x = (z.x - z.width / 2) * 1920;
            const y = (z.y - z.height / 2) * 1080;
            return `<rect x="${x}" y="${y}" width="${z.width * 1920}" height="${z.height * 1080}" fill="none" stroke="#ff1744" stroke-width="8"/><text x="${x}" y="${Math.max(28, y - 10)}" fill="#ff1744" font-size="28" font-weight="bold">${index + 1}</text>`;
          }).join('');
          const svg = `<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">${boxes}</svg>`;
          sharp(`diagnostic/${name}-frame.png`).composite([{input: Buffer.from(svg)}]).png().toFile(`diagnostic/${name}-selected.png`);
          console.log(name, {averageLuma: lighting.averageLuma, safe});
          NODE
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-night-zone-diagnostic
          path: |
            diagnostic/*-frame.png
            diagnostic/*-selected.png
            diagnostic/*-zones.json
          if-no-files-found: error
          retention-days: 3
