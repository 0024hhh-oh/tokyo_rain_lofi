name: Lighting visual test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighting-visual-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-lighting-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node for Remotion
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --no-audit --no-fund

      - name: Type-check isolated lighting test
        run: |
          npx tsc --noEmit --jsx react-jsx --module ESNext \
            --moduleResolution Bundler --target ES2022 --skipLibCheck \
            tests/lighting-visual-index.ts tests/LightingVisualTest.tsx

      - name: Render 8-second 1080p lighting test
        run: |
          mkdir -p dist
          npx remotion render \
            tests/lighting-visual-index.ts \
            LightingVisualTest \
            dist/lighting-visual-test.mp4 \
            --codec=h264 \
            --crf=14 \
            --concurrency=2 \
            --frames=0-239 \
            --log=verbose

      - name: Verify 1080p, duration, and one off-to-on change
        run: |
          read -r width height duration < <(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height:format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              dist/lighting-visual-test.mp4 | xargs
          )
          python - "$width" "$height" "$duration" <<'PY'
          import sys

          width, height = map(int, sys.argv[1:3])
          duration = float(sys.argv[3])
          if (width, height) != (1920, 1080):
              raise SystemExit(f"Expected 1920x1080; got {width}x{height}")
          if not 7.9 <= duration <= 8.1:
              raise SystemExit(f"Expected an 8-second MP4; got {duration:.3f}s")
          print(f"Verified: {width}x{height}, {duration:.3f}s")
          PY

          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          ffmpeg -v error -ss 2 -i dist/lighting-visual-test.mp4 -frames:v 1 "$validation_dir/off.png"
          ffmpeg -v error -ss 6 -i dist/lighting-visual-test.mp4 -frames:v 1 "$validation_dir/on.png"
          node --input-type=module - "$validation_dir/off.png" "$validation_dir/on.png" <<'NODE'
          import sharp from 'sharp';

          const [offFile, onFile] = process.argv.slice(2);
          const luma = async (file) => {
            const {channels} = await sharp(file).stats();
            return channels[0].mean * 0.2126 + channels[1].mean * 0.7152 + channels[2].mean * 0.0722;
          };
          const off = await luma(offFile);
          const on = await luma(onFile);
          const delta = on - off;
          if (delta < 8) throw new Error(`Off-to-on change is too weak: delta=${delta.toFixed(2)}`);
          console.log(`Off-to-on change verified: delta=${delta.toFixed(2)}`);
          NODE

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighting-visual-test-${{ github.run_id }}
          path: dist/lighting-visual-test.mp4
          if-no-files-found: error
          retention-days: 7
