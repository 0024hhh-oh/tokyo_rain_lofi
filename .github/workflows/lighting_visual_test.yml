name: Lighting overlay visual test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-overlay-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --no-audit --no-fund
      - name: Prepare ShinSUNA overlay sample
        run: |
          mkdir -p video_assets dist
          cp test_assets/night-shinsuna-background.jpeg video_assets/background.jpeg
          cp test_assets/night-shinsuna-light-overlay.png video_assets/light_overlay.png
          node scripts/prepare_remotion_background.mjs video_assets
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';
          const lighting = JSON.parse(await fs.readFile('src/generated-light-zones.json', 'utf8'));
          if (lighting.overlay !== 'light_overlay.png' || lighting.animate !== true) {
            throw new Error('Explicit light_overlay.png was not selected.');
          }
          for (const file of ['public/background.png', 'public/light_overlay.png']) {
            const metadata = await sharp(file).metadata();
            if (metadata.width !== 1920 || metadata.height !== 1080) throw new Error(`${file} is not 1920x1080`);
          }
          console.log('ShinSUNA overlay selected; no image light detection was used.');
          NODE
      - name: Type-check
        run: npm run typecheck
      - name: Render 10-second Remotion sample
        run: |
          npx remotion render src/index.ts NightLightingLoop dist/shinsuna-light-overlay-sample.mp4 \
            --codec=h264 --crf=14 --concurrency=2 --frames=0-299 --log=verbose
      - name: Verify sample and upload Artifact
        run: |
          read -r width height duration < <(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height:format=duration \
              -of default=noprint_wrappers=1:nokey=1 dist/shinsuna-light-overlay-sample.mp4 | xargs
          )
          python - "$width" "$height" "$duration" <<'PY'
          import sys
          if tuple(map(int, sys.argv[1:3])) != (1920, 1080): raise SystemExit('sample is not 1920x1080')
          if not 9.9 <= float(sys.argv[3]) <= 10.1: raise SystemExit('sample is not 10 seconds')
          print(f'Verified sample: {sys.argv[1]}x{sys.argv[2]}, {float(sys.argv[3]):.3f}s')
          PY
          ffmpeg -v error -ss 0.30 -i dist/shinsuna-light-overlay-sample.mp4 -frames:v 1 dist/steady.png
          ffmpeg -v error -ss 0.92 -i dist/shinsuna-light-overlay-sample.mp4 -frames:v 1 dist/boost.png
          ffmpeg -v error -ss 4.80 -i dist/shinsuna-light-overlay-sample.mp4 -frames:v 1 dist/recovered.png
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          const decode = file => sharp(file).removeAlpha().raw().toBuffer({resolveWithObject: true});
          const [steady, boost, recovered] = await Promise.all(['dist/steady.png','dist/boost.png','dist/recovered.png'].map(decode));
          const meanDelta = (a,b) => a.data.reduce((sum,v,i) => sum + Math.abs(v-b.data[i]),0) / a.data.length;
          const changed = meanDelta(steady, boost);
          const recovery = meanDelta(steady, recovered);
          if (changed < 0.1) throw new Error(`overlay did not change sample: ${changed}`);
          if (recovery > changed * 0.35) throw new Error(`overlay did not return near zero: ${recovery}`);
          console.log(`Verified positive overlay change=${changed.toFixed(2)} recovery=${recovery.toFixed(2)}; no black layer is rendered.`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: shinsuna-light-overlay-sample
          path: |
            dist/shinsuna-light-overlay-sample.mp4
            dist/steady.png
            dist/boost.png
            dist/recovered.png
          if-no-files-found: error
