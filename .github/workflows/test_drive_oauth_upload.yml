name: Test personal Drive MP4 upload

on:
  workflow_dispatch:

jobs:
  upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create one-second test MP4
        run: |
          mkdir -p dist
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=0x101820:s=320x180:d=1 \
            -vf "drawtext=text='Tokyo ChillMatic Drive OAuth test':fontcolor=white:fontsize=12:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            dist/drive_oauth_test.mp4

      - name: Upload test MP4 to personal Google Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          TOKYO_CHILLMATIC_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.TOKYO_CHILLMATIC_DRIVE_OUTPUT_FOLDER_ID }}
        run: |
          python scripts/upload_drive_output.py \
            --file dist/drive_oauth_test.mp4 \
            --output-name drive_oauth_test.mp4
