name: Remotion lighting CI

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "scripts/prepare_remotion_background.mjs"
      - "scripts/render_night_background.sh"
      - "scripts/night_test_drive.py"
      - "scripts/render_night_test_video.sh"
      - "scripts/validate_visible_lighting.mjs"
      - "scripts/create_remotion_fixture.mjs"
      - "tests/**"
      - "test_assets/night-shinsuna-background.jpeg"
      - ".github/workflows/generate_lofi_video.yml"
      - ".github/workflows/remotion_lighting_ci.yml"

permissions:
  contents: read

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Test Drive workflow separation
        run: |
          python -m pip install pytest
          python -m pytest \
            tests/test_drive_night_test.py \
            tests/test_generate_lofi_video_workflow.py
      - name: Render a six-second visibly changing lighting sample
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node scripts/create_remotion_fixture.mjs
          mkdir -p video_assets/tracks dist
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=6" \
            -c:a libmp3lame video_assets/tracks/night-test.mp3
          NIGHT_TEST_SECONDS=6 REMOTION_FRAMES=0-179 \
            bash scripts/render_night_test_video.sh
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 dist/night-test.mp4
      - name: Render accepted v10 lighting through the production night-video path
        run: |
          rm -rf video_assets public dist
          mkdir -p video_assets dist
          cp test_assets/night-shinsuna-background.jpeg video_assets/night-source-still.jpeg
          cp test_assets/rain-video-fixture.mp4 video_assets/rain-motion.mp4
          ffmpeg -y -loop 1 -i video_assets/night-source-still.jpeg \
            -stream_loop -1 -i video_assets/rain-motion.mp4 \
            -filter_complex "[0:v]scale=1920:1080,fps=30,format=rgba[base];[1:v]scale=1920:1080,fps=30,format=gray,tblend=all_mode=difference,eq=contrast=8:brightness=-0.2[mask];color=c=white@0.0:s=1920x1080:r=30,format=rgba[blank];[blank][mask]alphamerge[rain];[base][rain]overlay=shortest=1,format=yuv420p" \
            -t 10 -r 30 -c:v libx264 video_assets/background.mp4
          bash scripts/render_night_background.sh
          read -r width height duration < <(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height:format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              video_assets/background.mp4 | xargs
          )
          audio_streams="$(ffprobe -v error -select_streams a \
            -show_entries stream=index -of csv=p=0 \
            video_assets/background.mp4 | wc -l)"
          python - "$width" "$height" "$duration" "$audio_streams" <<'PY'
          import sys

          width, height = map(int, sys.argv[1:3])
          duration = float(sys.argv[3])
          audio_streams = int(sys.argv[4])
          if (width, height) != (1920, 1080):
              raise SystemExit(f"Expected 1920x1080; got {width}x{height}")
          if not 29.9 <= duration <= 30.1:
              raise SystemExit(f"Expected 30 seconds; got {duration:.3f}")
          if audio_streams != 0:
              raise SystemExit(f"Expected zero audio streams; got {audio_streams}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-lighting-test
          path: |
            dist/night-test.mp4
            video_assets/background.mp4
          retention-days: 7
