name: Remotion lighting CI

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "scripts/prepare_remotion_background.mjs"
      - "scripts/render_night_background.sh"
      - "tests/**"
      - "test_assets/shinsuna-daylight-regression.png"
      - "test_assets/shinsuna-light-overlay.png"
      - ".github/workflows/remotion_lighting_ci.yml"

permissions:
  contents: read

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare explicit ShinSUNA overlay sample
        run: |
          mkdir -p video_assets dist
          cp test_assets/shinsuna-daylight-regression.png video_assets/background.png
          cp test_assets/shinsuna-light-overlay.png video_assets/light_overlay.png
          node scripts/prepare_remotion_background.mjs video_assets
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const lighting = JSON.parse(await fs.readFile('src/generated-light-zones.json', 'utf8'));
          if (lighting.animate !== true || lighting.overlay !== 'light_overlay.png') throw new Error('overlay was not selected');
          NODE
      - name: Render 10-second sample and upload Artifact
        run: |
          npx remotion render src/index.ts NightLightingLoop dist/shinsuna-light-overlay-sample.mp4 \
            --codec=h264 --crf=14 --concurrency=2 --frames=0-299 --log=verbose
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of default=noprint_wrappers=1 dist/shinsuna-light-overlay-sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: shinsuna-light-overlay-sample
          path: dist/shinsuna-light-overlay-sample.mp4
          if-no-files-found: error
          retention-days: 7
