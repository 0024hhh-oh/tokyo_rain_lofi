name: Repair YouTube copy UUID metadata
on:
  push:
    branches: [main]
    paths: [scripts/repair_youtube_metadata.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: generate-lofi-video
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-api-python-client google-auth
      - name: Repair affected recent uploads and verify metadata
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/repair_youtube_metadata.py --recent-runs --video-id yJIgSTG9uuc --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-metadata-backups
          path: metadata-backups/
          if-no-files-found: ignore
