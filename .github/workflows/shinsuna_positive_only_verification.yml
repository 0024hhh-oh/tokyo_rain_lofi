name: ShinSUNA positive-only verification

on:
  pull_request:
    paths:
      - "src/NightVideoLightingLoop.tsx"
      - "scripts/prepare_remotion_background.mjs"
      - ".github/workflows/shinsuna_positive_only_verification.yml"

permissions:
  contents: read

jobs:
  render-shinsuna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: pip install -r requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download only the completed ShinSUNA source MOV
        run: |
          mkdir -p video_assets dist
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          service = build("drive", "v3", credentials=credentials, cache_discovery=False)
          request = service.files().get_media(
              fileId="1R6pwTz2LsNXwFvBxux-QnM5cal5tjBTn",
              supportsAllDrives=True,
          )
          destination = Path("video_assets/background.mov")
          with destination.open("wb") as handle:
              downloader = MediaIoBaseDownload(handle, request)
              done = False
              while not done:
                  _, done = downloader.next_chunk()
          print(f"Downloaded ShinSUNA source: {destination.stat().st_size} bytes")
          PY
      - name: Render through the current production night path
        env:
          ASSET_DIR: video_assets
        run: bash scripts/render_night_background.sh
      - name: Verify the former false target now fails closed
        run: |
          node - <<'NODE'
          const lighting = require('./src/generated-light-zones.json');
          const safe = lighting.zones
            .filter((zone) => zone.hasLightCore && zone.isCompactEmitter && zone.warmth >= 0.75 && zone.y < 0.72)
            .slice(0, 3);
          console.log({averageLuma: lighting.averageLuma, animate: lighting.animate, safe});
          if (lighting.animate || safe.length !== 0) {
            throw new Error(`Expected ShinSUNA to fail closed with zero targets; got ${safe.length}`);
          }
          NODE
          ffmpeg -v error -y -ss 0.10 -i video_assets/background.mp4 -frames:v 1 dist/baseline.png
          ffmpeg -v error -y -ss 1.17 -i video_assets/background.mp4 -frames:v 1 dist/former-event.png
          ffmpeg -v error -y -ss 1.17 -i video_assets/background.mp4 \
            -vf "crop=420:320:900:410,scale=840:640" -frames:v 1 dist/former-event-center-crop.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shinsuna-positive-only-sample
          path: |
            video_assets/background.mp4
            dist/baseline.png
            dist/former-event.png
            dist/former-event-center-crop.png
            src/generated-light-zones.json
          if-no-files-found: error
          retention-days: 7
