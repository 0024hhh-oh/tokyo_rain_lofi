name: Rain video lighting CI

on:
  pull_request:
    paths:
      - "test_assets/rain-video-fixture.mp4"
      - "tests/RainVideoLightingTest.tsx"
      - "tests/rain-video-lighting-index.tsx"
      - "tests/rain-video-lighting-workflow.test.mjs"
      - ".github/workflows/rain_video_lighting_ci.yml"

permissions:
  contents: read

jobs:
  render-rain-video-lighting-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare silent rain-video fixture and approved light zones
        run: |
          mkdir -p public video_assets dist
          cp test_assets/rain-video-fixture.mp4 public/rain-video.mp4
          cat test_assets/lighting-real-scene.jpg.b64.* | base64 --decode > video_assets/background.jpg
          node scripts/prepare_remotion_background.mjs video_assets
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const lighting = JSON.parse(await fs.readFile('src/generated-light-zones.json', 'utf8'));
          const safeZones = lighting.zones
            .filter((zone) => zone.hasLightCore && zone.warmth >= 0.55 && zone.y < 0.72)
            .slice(0, 3);
          if (!lighting.animate || safeZones.length !== 3) {
            throw new Error(`Expected the approved three light zones; got ${safeZones.length}`);
          }
          NODE
      - name: Type-check isolated rain-video lighting test
        run: |
          npx tsc --noEmit --jsx react-jsx --module ESNext \
            --moduleResolution Bundler --target ES2022 --skipLibCheck \
            --resolveJsonModule --allowSyntheticDefaultImports \
            tests/rain-video-lighting-index.tsx tests/RainVideoLightingTest.tsx
      - name: Render 30-second silent rain video with Remotion lighting
        run: |
          npx remotion render \
            tests/rain-video-lighting-index.tsx \
            RainVideoLightingTest \
            dist/rain-video-lighting-test.mp4 \
            --codec=h264 \
            --crf=14 \
            --concurrency=2 \
            --muted \
            --frames=0-899 \
            --log=verbose
      - name: Verify 1080p, 30 seconds, and no source audio
        run: |
          read -r width height duration < <(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height:format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              dist/rain-video-lighting-test.mp4 | xargs
          )
          audio_streams="$(ffprobe -v error -select_streams a \
            -show_entries stream=index -of csv=p=0 \
            dist/rain-video-lighting-test.mp4 | wc -l)"
          python - "$width" "$height" "$duration" "$audio_streams" <<'PY'
          import sys

          width, height = map(int, sys.argv[1:3])
          duration = float(sys.argv[3])
          audio_streams = int(sys.argv[4])
          if (width, height) != (1920, 1080):
              raise SystemExit(f"Expected 1920x1080; got {width}x{height}")
          if not 29.9 <= duration <= 30.1:
              raise SystemExit(f"Expected a 30-second MP4; got {duration:.3f}s")
          if audio_streams != 0:
              raise SystemExit(f"Output must not contain an audio stream; got {audio_streams}")
          print(f"Verified silent output: {width}x{height}, {duration:.3f}s")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rain-video-lighting-test
          path: dist/rain-video-lighting-test.mp4
          if-no-files-found: error
          retention-days: 7
